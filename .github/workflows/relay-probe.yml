name: Relay probe

on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  guard:
    name: Require the real default branch
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Check the current repository default branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          DISPATCH_REF: ${{ github.ref }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import urllib.request

          code = 1
          try:
              repo = os.environ["REPOSITORY"]
              if not re.fullmatch(r"[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+", repo):
                  raise ValueError()
              request = urllib.request.Request(
                  f"https://api.github.com/repos/{repo}",
                  headers={"Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                           "Accept": "application/vnd.github+json"},
              )
              with urllib.request.urlopen(request, timeout=20) as response:
                  data = response.read(65537)
              if len(data) > 65536:
                  raise ValueError()
              branch = json.loads(data)["default_branch"]
              code = 0 if (os.environ["EVENT_NAME"] == "workflow_dispatch"
                           and isinstance(branch, str) and branch
                           and os.environ["DISPATCH_REF"] == f"refs/heads/{branch}") else 1
          except Exception:
              code = 1
          line = f"phase=default_branch errorcode={code}\n"
          print(line, end="")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write(line)
          raise SystemExit(code)
          PY

  probe:
    name: Protected 16 MiB relay probe
    needs: [guard]
    environment: release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # CI-only tool from Ubuntu's signed apt sources; no product redistribution.
      - name: Install rclone without exposing command output
        run: |
          python3 - <<'PY'
          import os
          import subprocess

          code = 0
          for args in (["sudo", "apt-get", "update", "-qq"],
                       ["sudo", "apt-get", "install", "-y", "--no-install-recommends", "rclone"]):
              try:
                  code = subprocess.run(args, stdout=subprocess.DEVNULL,
                                        stderr=subprocess.DEVNULL, timeout=90).returncode
              except subprocess.TimeoutExpired:
                  code = 124
              except Exception:
                  code = 1
              if code:
                  break
          line = f"phase=install errorcode={code}\n"
          print(line, end="")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write(line)
          raise SystemExit(1 if code else 0)
          PY
      - name: Upload, read back, verify, and remove only this probe
        env:
          NF_RELAY_RCLONE_CONFIG: ${{ secrets.NF_RELAY_RCLONE_CONFIG }}
          REPOSITORY_ID: ${{ github.repository_id }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          python3 - <<'PY'
          import configparser
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import shutil
          import signal
          import subprocess
          import tempfile
          import time
          import urllib.parse
          import uuid

          size = 16 * 1024 * 1024
          result = {"uploadSeconds": None, "downloadSeconds": None, "byteCount": size,
                    "hashMatched": False, "uploadBytesPerSecond": None, "phases": []}
          directory = None
          remote = None
          attempted = False
          phase = "config"

          class ProbeFailure(Exception):
              pass

          def record(name, code):
              result["phases"].append({"phase": name, "errorcode": code})

          def interrupted(signum, frame):
              raise ProbeFailure()

          signal.signal(signal.SIGTERM, interrupted)
          signal.signal(signal.SIGINT, interrupted)

          def rclone(name, args):
              start = time.monotonic()
              code = 1
              try:
                  code = subprocess.run(
                      ["rclone", "--config", str(directory / "rclone.conf"),
                       "--retries", "1", "--low-level-retries", "1",
                       "--contimeout", "15s", "--timeout", "30s", "--max-duration", "90s",
                       "--max-transfer", "17Mi", "--cutoff-mode", "HARD",
                       "--stats", "0", "--log-level", "ERROR", *args],
                      env={"PATH": os.environ["PATH"], "HOME": str(directory)},
                      stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL, timeout=90,
                  ).returncode
              except subprocess.TimeoutExpired:
                  code = 124
              finally:
                  elapsed = round(time.monotonic() - start, 3)
                  if name in ("upload", "download"):
                      result[f"{name}Seconds"] = elapsed
                  record(name, code)
              if code:
                  raise ProbeFailure()
              return elapsed

          try:
              secret = os.environ.pop("NF_RELAY_RCLONE_CONFIG", "")
              if not secret or len(secret.encode()) > 16384:
                  raise ProbeFailure()
              config = configparser.ConfigParser(interpolation=None)
              config.read_string(secret)
              if config.sections() != ["nf_update"] or config.defaults():
                  raise ProbeFailure()
              options = config["nf_update"]
              url = urllib.parse.urlsplit(options.get("url", ""))
              if (set(options) - {"type", "url", "vendor", "user", "pass"}
                  or options.get("type") != "webdav" or url.scheme != "https"
                  or url.hostname != "webdav.123pan.cn" or url.username or url.password
                  or url.port not in (None, 443) or url.query or url.fragment):
                  raise ProbeFailure()
              ids = [os.environ[key] for key in ("REPOSITORY_ID", "RUN_ID", "RUN_ATTEMPT")]
              if not all(re.fullmatch(r"[0-9]+", value) for value in ids):
                  raise ProbeFailure()
              os.umask(0o077)
              directory = Path(tempfile.mkdtemp(prefix="nf-relay-probe-"))
              with open(directory / "rclone.conf", "x", opener=lambda path, flags: os.open(path, flags, 0o600)) as file:
                  file.write(secret)
              del secret
              record("config", 0)
              phase = "generate"
              source = directory / "source.bin"
              source.write_bytes(os.urandom(size))
              expected = hashlib.sha256(source.read_bytes()).digest()
              remote = f"nf_update:narrafork-ci-relay/probes/{'/'.join(ids)}/{uuid.uuid4().hex}.bin"
              phase = "upload"
              attempted = True
              seconds = rclone("upload", ["copyto", "--immutable", str(source), remote])
              result["uploadBytesPerSecond"] = round(size / max(seconds, 0.001), 2)
              phase = "download"
              target = directory / "download.bin"
              rclone("download", ["copyto", remote, str(target)])
              phase = "verify"
              result["hashMatched"] = (target.stat().st_size == size
                                       and hashlib.sha256(target.read_bytes()).digest() == expected)
              record("verify", 0 if result["hashMatched"] else 1)
          except Exception:
              if not result["phases"] or result["phases"][-1]["phase"] != phase:
                  record(phase, 1)
          finally:
              if attempted and remote:
                  try:
                      rclone("cleanup_remote", ["deletefile", remote])
                  except Exception:
                      pass
              if directory:
                  try:
                      shutil.rmtree(directory)
                      record("cleanup_local", 0)
                  except Exception:
                      record("cleanup_local", 1)
              line = json.dumps(result, separators=(",", ":")) + "\n"
              print(line, end="")
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
                  summary.write(line)
          raise SystemExit(0 if result["hashMatched"] and all(
              item["errorcode"] == 0 for item in result["phases"]) else 1)
          PY
