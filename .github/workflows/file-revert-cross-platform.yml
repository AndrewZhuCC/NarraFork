name: file-revert-cross-platform

# Verified file rollback runs on POSIX and Windows servers. Windows semantics
# (synthetic modes, no O_NOFOLLOW, sharing violations, NTFS object identity) can
# only be proven on a real Windows host, so run the pipeline tests on both.
on:
  push:
    branches:
      - main
    paths:
      - "server/services/file-change-*.ts"
      - "server/services/revert-*.ts"
      - "server/services/workspace-write-*.ts"
      - "server/services/narrator-scoped-revert.ts"
      - "server/lib/agent/execution/local-backend.ts"
      - "server/lib/agent/execution/path-semantics.ts"
      - "server/lib/agent/tools/bash.ts"
      - "server/lib/agent/tools/__tests__/bash-workspace-activity.test.ts"
      - "shared/file-change-protocol.ts"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/file-revert-cross-platform.yml"
  pull_request:
    paths:
      - "server/services/file-change-*.ts"
      - "server/services/revert-*.ts"
      - "server/services/workspace-write-*.ts"
      - "server/services/narrator-scoped-revert.ts"
      - "server/lib/agent/execution/local-backend.ts"
      - "server/lib/agent/execution/path-semantics.ts"
      - "server/lib/agent/tools/bash.ts"
      - "server/lib/agent/tools/__tests__/bash-workspace-activity.test.ts"
      - "shared/file-change-protocol.ts"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/file-revert-cross-platform.yml"
  workflow_dispatch:

jobs:
  file-revert:
    name: File revert pipeline (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build frontend
        run: bun run build

      - name: Install VS Code extension type dependencies
        run: bun install --cwd vscode-extension --frozen-lockfile

      - name: Check TypeScript
        run: bunx tsgo --noEmit

      - name: Verify Windows scratch volumes
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($path in @($env:TEMP, $env:RUNNER_TEMP)) {
            $volume = [System.IO.DriveInfo]::new([System.IO.Path]::GetPathRoot($path))
            if ($volume.DriveFormat -ne 'NTFS' -or $volume.DriveType -ne 'Fixed') {
              throw "File revert scratch must remain on a fixed NTFS volume: $path"
            }
            [pscustomobject]@{ Path = $path; Volume = $volume.Name; FileSystem = $volume.DriveFormat; DriveType = $volume.DriveType.ToString() } | ConvertTo-Json -Compress
          }

      # Keep the default profile-temp canonicalization/alias coverage separate.
      - name: Check profile temp path isolation
        if: runner.os == 'Windows'
        run: >-
          bun test --isolate
          ./tests/preload-isolation.test.ts
          ./server/lib/agent/execution/__tests__/local-backend-read.test.ts

      - name: Record file revert scratch location
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          TMPDIR: ${{ runner.temp }}
        run: >-
          bun -e 'import { tmpdir } from "node:os"; import { realpath, statfs } from "node:fs/promises";
          const path = await realpath(tmpdir()); const volume = await statfs(path);
          console.log(JSON.stringify({ platform: process.platform, scratch: path, filesystemType: volume.type }));'

      - name: Run file revert tests
        # Use runner-owned scratch; do not change IO, fsync, test selection or deadlines.
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          TMPDIR: ${{ runner.temp }}
        run: >-
          bun test --isolate
          ./server/services/file-change-platform-capability.test.ts
          ./server/services/file-change-local-restore.test.ts
          ./server/services/file-change-runtime.test.ts
          ./server/services/file-change-namespace-cleanup.test.ts
          ./server/services/revert-transaction-service.test.ts
          ./server/services/revert-transaction-interleaving.test.ts
          ./server/services/revert-transaction-real-tools.test.ts
          ./server/services/revert-planner-local-access.test.ts
          ./server/services/revert-mutation-journal.test.ts
          ./server/services/narrator-scoped-revert.test.ts
          ./server/lib/agent/tools/__tests__/bash-workspace-activity.test.ts
